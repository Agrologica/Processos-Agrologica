<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agrológica | Central de Notas em construção</title>
<style>
:root{--blue:#00509E;--green:#AECC09;--orange:#F08000;--bg:#fff;--ink:#0b2a4a;--muted:#4b6580;--line:#dbe5ef;--panel:#f3f7fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071a2e;--ink:#eef4fa;--muted:#a9bdd0;--line:#1c3a5a;--panel:#0d2640}}
:root[data-theme="dark"]{--bg:#071a2e;--ink:#eef4fa;--muted:#a9bdd0;--line:#1c3a5a;--panel:#0d2640}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Barlow","Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.logo{background:#fff;border-radius:20px;padding:18px 28px;width:min(360px,86%)}
.logo img{display:block;width:100%;height:auto}
h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:36px 0 12px;color:var(--blue);font-weight:700;letter-spacing:-.01em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:#fff}}
:root[data-theme="dark"] h1{color:#fff}
p.lead{max-width:52ch;margin:0 auto;font-size:clamp(16px,2.2vw,19px);line-height:1.55;color:var(--muted)}
.track{display:flex;gap:6px;width:min(420px,90%);margin:34px auto 12px}
.track i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.track i:nth-child(1){background:var(--green)}
.track i:nth-child(2){background:var(--orange)}
.status{font-weight:600;color:var(--orange);margin:0 0 34px;font-size:15px}
.mods{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:640px}
.mods span{padding:10px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:15px}
footer{padding:20px 24px;text-align:center;font-size:14px;color:var(--muted);border-top:4px solid var(--blue)}
footer::before{content:"";display:block;height:4px;margin:-24px -24px 20px;background:linear-gradient(90deg,var(--green) 0 34%,var(--orange) 34% 67%,var(--blue) 67%)}
</style>
</head>
