<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!-- Versão Microsoft 365: configuração do ambiente + biblioteca de login da Microsoft (carregar ANTES do script da central) -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js"></script>

<title>Central de Atendimento Operacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --brand:#0D2B4E; --hl:#EE6A1F; --title:var(--brand);
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EBEFF4; --ink:#1A2230; --ink-2:#4F5B6B; --ink-3:#737F8E;
  --line:#D8DEE6; --line-2:#C2CAD5;
  --accent:var(--brand); --accent-ink:#FFFFFF; --accent-soft:color-mix(in srgb,var(--brand) 12%,#FFFFFF);
  --warn:#9A6212; --warn-soft:#FAEFD9; --crit:#B42318; --crit-soft:#FBE4E1;
  --ok:#2A7549; --ok-soft:#DCEFE3; --info:#2B63A3; --info-soft:#DDE8F5; --mute-soft:#E7EAEA;
  --shadow:0 12px 32px rgba(18,40,40,.14);
  --f-display:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --surface:#181E26; --surface-2:#212833; --ink:#E6EAF0; --ink-2:#A3ADBA; --ink-3:#7D8796;
    --line:#2B3340; --line-2:#3B4555;
    --accent:color-mix(in srgb,var(--brand) 62%,#FFFFFF); --accent-ink:#0E131A; --title:var(--ink); --accent-soft:color-mix(in srgb,var(--brand) 26%,#181E26);
    --warn:#E5AB4E; --warn-soft:#382A12; --crit:#F2766B; --crit-soft:#3D1B19;
    --ok:#62C48C; --ok-soft:#163324; --info:#86B4EA; --info-soft:#1A2B41; --mute-soft:#232E30;
    --shadow:0 12px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --surface:#181E26; --surface-2:#212833; --ink:#E6EAF0; --ink-2:#A3ADBA; --ink-3:#7D8796;
  --line:#2B3340; --line-2:#3B4555;
  --accent:color-mix(in srgb,var(--brand) 62%,#FFFFFF); --accent-ink:#0E131A; --title:var(--ink); --accent-soft:color-mix(in srgb,var(--brand) 26%,#181E26);
  --warn:#E5AB4E; --warn-soft:#382A12; --crit:#F2766B; --crit-soft:#3D1B19;
  --ok:#62C48C; --ok-soft:#163324; --info:#86B4EA; --info-soft:#1A2B41; --mute-soft:#232E30;
  --shadow:0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0;min-height:100%;display:flex;flex-direction:column}
.wrap{flex:1;width:100%}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:0;margin:0;text-wrap:balance;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.lbl{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);box-shadow:0 1px 0 var(--line);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px 0}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.mark{min-width:34px;height:34px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:14px;padding:0 6px}
.mark.logo{background:none;padding:0;height:auto;min-width:0}
.mark.logo img{height:58px;width:auto;max-width:200px;object-fit:contain}
.lg-escuro{display:none!important}
@media (max-width:560px){.mark.logo{flex:0 0 auto}.mark.logo img{height:40px;max-width:100px}.brand{min-width:0}.brand>div:last-child{min-width:0}.brand h1{font-size:16px!important;line-height:1.2}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-claro{display:none!important}:root:not([data-theme="light"]) .lg-escuro{display:block!important}}
:root[data-theme="dark"] .lg-claro{display:none!important}
:root[data-theme="dark"] .lg-escuro{display:block!important}
.brand .empresa{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.usercorner{margin-left:auto;position:relative;padding-bottom:12px}
.usericon{width:38px;height:38px;border-radius:50%;background:var(--brand,var(--accent));color:#fff;border:2px solid transparent;display:grid;place-items:center;font-weight:700;font-size:14px;cursor:pointer;padding:0}
.usericon:hover,.usericon[aria-expanded="true"]{border-color:var(--hl,var(--accent))}
.usermenu{position:fixed;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:14px;z-index:9999}
.usermenu .um-name{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usermenu .um-email{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.usermenu .um-sair{margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer}
.usermenu .um-sair:hover{background:var(--line)}
@media (max-width:560px){.usermenu{min-width:210px}}
.foot{margin:40px -16px 0;padding-inline:16px;background:var(--brand);color:#fff;position:relative;border-top:4px solid var(--hl);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot-in{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;padding-block:18px}
.valor{display:flex;align-items:center;gap:12px;padding:6px 18px;border-left:1px solid rgba(255,255,255,.22)}
.valor:first-child{border-left:0;padding-left:0}
.valor svg{width:38px;height:38px;color:var(--hl);flex:none}
.valor span{font-weight:700;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;line-height:1.25;max-width:17ch}
.foot-sub{max-width:1240px;margin:0 auto;padding:10px 0 14px;border-top:1px solid rgba(255,255,255,.14);font-size:12px;color:rgba(255,255,255,.72);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* cabeçalho com curva */
.top{overflow:hidden}
.top .swoosh{position:absolute;left:0;top:0;height:100%;width:64px;pointer-events:none}
.top-in{position:relative;padding-left:46px;max-width:none}
/* hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 32px;overflow:hidden;margin-bottom:22px}
.hero::after{content:"";position:absolute;left:-70px;bottom:-110px;width:320px;height:160px;border-top:3px solid var(--hl);border-radius:160px 160px 0 0;opacity:.85;pointer-events:none}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--hl)}
.hero h2{font-size:34px;color:var(--title);line-height:1.1;margin-top:6px}
.hero p{color:var(--ink-2);margin:10px 0 0;max-width:46ch;font-size:15px}
.hero .facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px}
.hero .fact{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.hero .fact svg{width:20px;height:20px;color:var(--hl)}
.orbit{position:relative;width:470px;height:420px;margin:0 auto}
.orbit svg.lines{position:absolute;inset:0;width:100%;height:100%}
.hub{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;text-align:center;box-shadow:0 0 0 6px var(--surface),0 0 0 8px var(--hl)}
.hub svg{width:42px;height:42px}
.hub-logo{background:#fff;color:#0D2B4E;width:150px;height:150px;margin:-75px 0 0 -75px}
.hub-logo img{width:112px;height:auto;display:block;margin:0 auto}
.hub-logo b{font-size:11.5px;color:#0D2B4E}
.hub-logo.on-brand{background:var(--brand)}
.hub-logo.on-brand b{color:#fff}
.hub b{display:block;font-size:12.5px;line-height:1.15;margin-top:4px;font-weight:600}
.node{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:var(--surface);border:2px solid var(--hl);color:var(--accent);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.node:hover,.node:focus-visible{transform:scale(1.08);background:var(--hl);color:#fff}
.node svg{width:28px;height:28px}
.node.up .nl{top:auto;bottom:70px}
.node .nl{position:absolute;top:70px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:600;color:var(--ink-2);pointer-events:none}
.ico{width:22px;height:22px}
.areas-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.areas-h h3{font-size:18px}
.area .badge svg{width:22px;height:22px}
.icons{display:flex;flex-wrap:wrap;gap:6px}
.icons button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icons button[aria-pressed="true"]{border-color:var(--hl);color:var(--hl);box-shadow:0 0 0 2px color-mix(in srgb,var(--hl) 25%,transparent)}
.icons svg{width:22px;height:22px}
.logoprev{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logoprev .box{height:56px;min-width:120px;border:1px dashed var(--line-2);border-radius:8px;display:grid;place-items:center;padding:6px 10px;background:var(--surface)}
.logoprev .box.dk{background:var(--brand)}
.logoprev img{max-height:44px;max-width:200px}
.colorin{display:flex;gap:8px;align-items:center}
.colorin input[type=color]{width:42px;height:34px;border:1px solid var(--line-2);border-radius:6px;padding:2px;background:var(--surface)}
.brand h1{font-size:20px}
.brand .sub{font-size:12px;color:var(--ink-2);line-height:1.2}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;align-self:flex-end}
.tab{border:0;background:none;padding:10px 14px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hl)}
.count{font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);border-radius:10px;padding:1px 7px}
.tab[aria-selected="true"] .count{background:var(--accent-soft);color:var(--accent)}

.eqbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.eqbar .lbl{margin-right:4px}
.eqchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 6px 4px 11px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
.eqchip.zero{color:var(--ink-3);font-weight:500}
.eqchip:hover{border-color:var(--ink-3)}
.eqchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.eqchip[aria-pressed="true"] .count{background:color-mix(in srgb,var(--accent-ink) 22%,transparent);color:var(--accent-ink)}
.resp{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);margin-top:2px;min-width:0}
.resp .ico{width:14px;height:14px;color:var(--hl);flex:none}
.resp b{font-weight:600;color:var(--ink)}
.resp.sem{color:var(--ink-3);font-style:italic}
.dtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.overlay{position:fixed;inset:0;z-index:55;background:rgba(13,43,78,.5);display:flex;justify-content:center;align-items:flex-start;padding:36px 16px;overflow-y:auto;overscroll-behavior:contain;animation:ovin .15s ease-out}
.overlay .detail{position:relative!important;inset:auto!important;top:auto!important;max-height:none!important;overflow:visible;width:min(920px,100%);border-radius:12px!important;box-shadow:0 24px 64px rgba(0,0,0,.3);z-index:auto;padding-top:0!important}
.overlay.cheia{padding:0}
.overlay.cheia .detail{width:100%;min-height:100%;border-radius:0!important;border:0}
.overlay .closeD{display:none}
body.modal-aberto{overflow:hidden}
@keyframes ovin{from{opacity:0}to{opacity:1}}
@media (max-width:720px){.overlay{padding:0}.overlay .detail{width:100%;min-height:100%;border-radius:0!important;border:0}.overlay .dtools .btn{display:none}}
.anxexist{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.file.rem .fn{text-decoration:line-through;opacity:.55}
.banner{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);font-size:13px}
main{padding-top:22px}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:6px;border-radius:6px;line-height:1;font-size:15px}
.iconbtn:hover{color:var(--ink);background:var(--surface-2)}
.iconbtn:disabled{opacity:.35;cursor:default;background:none}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;min-height:38px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:13px;font-weight:500;color:var(--ink-2)}
.field .req{color:var(--crit);margin-left:2px}
.field.err input,.field.err select,.field.err textarea,.field.err .drop{border-color:var(--crit)}
.field .errmsg{font-size:12px;color:var(--crit)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 16px}
.yn{display:flex;gap:8px}
.yn label{flex:1;display:flex;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;cursor:pointer;background:var(--surface)}
.yn input{accent-color:var(--accent)}

/* pills */
.stc{min-width:0;display:flex}
.stc .pill{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-novo{background:var(--info-soft);color:var(--info)}
.s-atend{background:var(--accent-soft);color:var(--accent)}
.s-aguard{background:var(--warn-soft);color:var(--warn)}
.s-concl{background:var(--ok-soft);color:var(--ok)}
.s-canc{background:var(--mute-soft);color:var(--ink-3)}
.p-urg{color:var(--crit);font-weight:600}
.p-alta{color:var(--warn);font-weight:600}
.tag{font-size:11.5px;border:1px solid var(--line-2);border-radius:5px;padding:0 6px;color:var(--ink-3)}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}

/* ABRIR */
.intro{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap;margin-bottom:18px}
.intro h2{font-size:24px}
.intro p{margin:4px 0 0;color:var(--ink-2);max-width:60ch}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.area{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:12px;min-width:0}
.area .badge{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;letter-spacing:.03em;flex:none}
.area .txt{min-width:0;display:flex;flex-direction:column}
.area h3{font-size:16px!important}
.area .sla{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.area:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.area .code{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.area p{margin:0;color:var(--ink-2);font-size:13px}
.area .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.formwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.form{padding:22px;display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec + .sec{border-top:1px solid var(--line);padding-top:20px}
.sec h3{font-size:17px}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);background:none;border:0;cursor:pointer;padding:0;margin-bottom:10px}
.back:hover{color:var(--ink)}
.formhead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.formhead h2{font-size:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.field{flex-direction:row;align-items:center}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.drop{border:1.5px dashed var(--line-2);border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .name{font-weight:500}
.filelist{display:flex;flex-direction:column;gap:6px;width:100%}
.file{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aside{padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:90px}
.aside h3{font-size:16px}
.aside ol{margin:0;padding-left:18px;color:var(--ink-2);font-size:13px;display:flex;flex-direction:column;gap:4px}
.instr{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.submitrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.done{padding:36px 28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:560px;margin:20px auto}

.kcol.over{outline:2px dashed var(--accent);outline-offset:-2px}
.khead{display:flex;align-items:center;gap:8px;padding:2px 2px 4px;font-weight:600}
.kdot{width:10px;height:10px;border-radius:50%}
.kname{flex:1}
.kbody{display:flex;flex-direction:column;gap:8px}
.kempty{border:1.5px dashed var(--line-2);border-radius:8px;padding:16px 10px;text-align:center;color:var(--ink-3);font-size:12.5px}
.kcard{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-2);border-radius:8px;padding:10px 12px;cursor:grab}
.kcard:hover{box-shadow:var(--shadow)}
.kcard[aria-current="true"]{outline:2px solid var(--accent)}
.kcard.drag{opacity:.5}
.kt{font-weight:600;line-height:1.3}
.kline{display:flex;justify-content:space-between;gap:8px;align-items:center}
.kline > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kprog{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:4px}
.kprog span{display:block;height:100%;background:var(--accent)}
.frow.st{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 44px minmax(0,1.5fr) minmax(0,1.2fr) auto}
.slacfg{display:flex;gap:6px;align-items:center}
.slacfg select{min-width:0}
.slacfg input{width:64px;padding:6px}
.frow.st input[type=color]{width:44px;height:36px;border:1px solid var(--line-2);border-radius:6px;padding:2px;background:var(--surface)}

/* CONFIG */
.cfg{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.cfgnav{padding:10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:84px}
.navitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;background:none;border:0;text-align:left;width:100%}
.navitem:hover{background:var(--surface-2)}
.navitem[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.navitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navitem.off .nm{color:var(--ink-3);text-decoration:line-through}
.navsep{border-top:1px solid var(--line);margin:8px 0}
.cfgmain{padding:22px;display:flex;flex-direction:column;gap:24px}
.cfgbar{position:sticky;bottom:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow);margin-top:16px}
.cfgbar .st{flex:1;font-size:13px}
.dirty{color:var(--warn);font-weight:600}
.tbl{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.6fr) auto auto;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.frow.two{grid-template-columns:minmax(0,1fr) auto auto}
.frow.att2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.2fr) auto auto}
.regra{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:6px;border-top:1px dashed var(--line)}
.regra select{width:auto;min-height:32px;padding:4px 8px}
.opscfg{flex-direction:column;align-items:stretch}
.oprow{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,2fr) auto auto auto;gap:8px;align-items:center}
.opadd{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prd.nosim{grid-template-columns:minmax(0,1fr) 100px 30px}
.prd.nosim.comlote{grid-template-columns:minmax(0,1fr) 130px 100px 30px}
.prd.larga{grid-template-columns:minmax(0,160px) 30px;justify-content:space-between;padding-bottom:10px;border-bottom:1px dashed var(--line)}.prd.larga.comlote{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 30px;justify-content:stretch}.prd.larga>input[aria-label=Produto]{grid-column:1/-1}.prd.ph.larga{display:none}
.optag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--hl)}
.regra-v{display:flex;flex-wrap:wrap;gap:4px 12px}
.pedcfg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.pedcfg input{width:64px;min-height:32px;padding:4px 6px}
.ped{gap:10px}
.pcli{border:1px solid var(--line);border-left:3px solid var(--hl);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.pcli-h{display:flex;justify-content:space-between;align-items:center}
.pgrp{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--hl);margin:6px 0 -2px}.notas{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.nota{display:flex;gap:4px;align-items:center}.nota input{width:150px}
.pcli-g{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.8fr);gap:10px}
.prods{display:flex;flex-direction:column;gap:6px}
.prd{display:grid;grid-template-columns:minmax(0,2.2fr) 80px 84px minmax(0,1.4fr) 30px;gap:6px;align-items:center}
.prd.ph{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.prd input,.prd select{min-height:34px;padding:6px 8px}
.prd input:disabled{background:var(--surface-2)}
.prods > .btn{align-self:flex-start}
input.bad,select.bad{border-color:var(--crit)!important;background:var(--crit-soft)}
.dped{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.dprod{display:flex;flex-direction:column;gap:3px}
.dprow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,.9fr);gap:10px;font-size:13px;border-top:1px dashed var(--line);padding-top:3px}
.anexar{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--line-2);border-radius:8px;padding:10px}
.anexar-r{display:flex;gap:8px}
.anexar-r select{flex:1;min-width:0}
.frow.eqrow{grid-template-columns:minmax(0,1.4fr) minmax(0,.7fr) minmax(0,1fr) auto auto}
.frow.fil{grid-template-columns:90px minmax(0,1fr) 100px 88px}
.frow.sh,.srow.sh{background:none;border:0;padding-block:0}
.srow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,1fr) 56px 34px;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.srow.off input,.srow.off select{opacity:.55}
.only-m{display:none}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;cursor:pointer}
.chk input{accent-color:var(--accent)}
.rowbtns{display:flex;gap:0}
.hint{font-size:12.5px;color:var(--ink-3);margin:0}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.storage{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{border:1px solid var(--line-2);border-radius:9px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.opt input{accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.opt .h{display:flex;gap:8px;align-items:center;font-weight:600}
.state{font-size:12px}
.state.bad{color:var(--warn)}
.state.good{color:var(--ok)}
.sectitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sectitle h3{font-size:18px}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:60;padding:24px}
.lightbox img{max-height:88vh;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:70;font-size:13.5px;box-shadow:var(--shadow)}
.ex{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--line-2);border-radius:4px;padding:0 5px;color:var(--ink-3)}
/* cadastro de veículos e campos com busca (placa / pessoa) */
.frow.vei{grid-template-columns:120px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto 34px}
.frow.vei.off input{opacity:.55}
.frow.vei.off .veip{text-decoration:line-through}
.vei2{grid-column:1 / -1;display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1.6fr) 150px;gap:8px;align-items:center}
.vei3{grid-column:1 / -1;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.veip{font-family:var(--f-mono);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.vcard{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-left:3px solid var(--hl);border-radius:8px;padding:8px 10px;background:var(--bg);font-size:12.5px;color:var(--ink-2)}
.vcard b{color:var(--ink);font-weight:600}
.vcard .pl{font-family:var(--f-mono);font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--ink);border-radius:5px;padding:1px 8px;letter-spacing:.06em}
.vcard.late{border-left-color:var(--crit)}
.pdfbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:color-mix(in srgb,var(--hl) 7%,var(--surface))}
.pdfbar .ico{width:20px;height:20px;color:var(--hl)}
.pdfbar b{font-weight:600}
@media (max-width:720px){.frow.vei{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.frow.vei>input:nth-of-type(2){grid-column:1 / 3}.frow.vei.sh,.vei2.sh{display:none}.vei2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.vei2>input:nth-of-type(3){grid-column:1 / 3}}

@media (max-width:1000px){
  .hero{grid-template-columns:minmax(0,1fr);padding:22px}
  .orbit{display:none}
  .hero h2{font-size:28px}
  .indgrid{grid-template-columns:minmax(0,1fr)}
  .board{grid-template-columns:minmax(0,1fr)}
  .detail{position:fixed;inset:0;max-height:none;border-radius:0;z-index:40;padding-top:env(safe-area-inset-top,0px)}
  .closeD{display:inline-flex}
  .formwrap{grid-template-columns:minmax(0,1fr)}
  .aside{position:static}
  .cfg{grid-template-columns:minmax(0,1fr)}
  .cfgnav{position:static;flex-direction:row;flex-wrap:wrap}
  .navitem{width:auto}
  .navsep{display:none}
}
@media (max-width:720px){
  .frow.eqrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .frow.eqrow > input{grid-column:1 / 3}
  .oprow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .oprow > input{grid-column:1 / 3}
  .pcli-g{grid-template-columns:minmax(0,1fr)!important}
  .prd.nosim{grid-template-columns:minmax(0,1fr) 80px 30px}
  .pcli-g > *{grid-column:auto!important}
  .prd{grid-template-columns:minmax(0,1fr) 70px 30px}
  .prd.ph{display:none}
  .prd > input[aria-label="Produto"]{grid-column:1 / 2}
  .prd > select{grid-column:1 / 2;grid-row:2}
  .prd > input[aria-label="Nome do similar"]{grid-column:2 / 4;grid-row:2}
  .prd{padding-bottom:6px;border-bottom:1px dashed var(--line)}
  .frow.att2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .frow.att2 > input{grid-column:1 / 3}
  .srow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .srow.sh{display:none}
  .srow input[aria-label="Nome"],.srow input[aria-label="E-mail"]{grid-column:1 / 3}
  .only-m{display:inline}
  .frow.fil.sh{display:none}
  .frow.fil{grid-template-columns:64px minmax(0,1fr)}
  .frow.fil > input[aria-label="Sigla"]{grid-column:1 / 2}
  .frow.fil > .rowbtns{grid-column:2 / 3;justify-self:end}
  .valor{border-left:0;padding:6px 0}
  .top-in{padding-left:44px}
  .hero h2{font-size:24px}
  .hero p{font-size:14px}
  .areas{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .area{padding:9px 10px;gap:10px}
  .area .badge{width:34px;height:34px;font-size:11px}
  .area .sla{display:none}
  .kanban{grid-auto-columns:84%}
  .filters .search{max-width:none;flex-basis:100%}
  .filters select{flex:1 1 45%;min-width:0}
  .frow.st{grid-template-columns:minmax(0,1fr) 48px}
  .frow.st > .slacfg{grid-column:1 / 3}
  .frow.st > select{grid-column:1 / 3}
  .frow.st > input[list]{grid-column:1 / 3;grid-row:2}
  .statbar .stat{flex-basis:45%;border-bottom:1px solid var(--line)}
  .frow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .frow > .rowbtns,.frow > .chk{justify-self:start}
  .frow .span2{grid-column:1 / 3}
  .brand h1{font-size:19px}
  .tabs{margin-left:0;width:100%}
  .actions{grid-template-columns:1fr}
  .form{padding:16px}
  .cfgmain{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* dashboards */
:root{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#4a3aa7;--c-outros:#a3acb8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#9085e9;--c-outros:#5d6878}}
:root[data-theme="dark"]{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#9085e9;--c-outros:#5d6878}
.dash-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dash-acts{display:flex;gap:8px;flex-wrap:wrap}
.dash-src{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dgrid{display:grid;gap:14px;margin-top:14px}
.dks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.dk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.dk-v{font-size:24px;font-weight:600;color:var(--title);line-height:1.2;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.dk-s{font-size:12.5px;color:var(--ink-2)}
.dk-warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}.dk-warn .dk-v{color:var(--warn)}
.dk-crit{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}.dk-crit .dk-v{color:var(--crit)}
.dp{padding:14px 16px;min-width:0}
.dp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dp-h h3{font-size:16px}
.d2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.dchart-wrap{width:100%;overflow:hidden}
.dchart{width:100%;height:auto;display:block}
.dchart .gl{stroke:var(--line);stroke-width:1}.dchart .gl0{stroke:var(--line-2);stroke-width:1}
.dchart .ax{fill:var(--ink-3);font-size:10px;font-family:var(--f-body)}
.dchart .dbar:hover path,.dchart .dbar:hover rect[fill]:not([fill=transparent]){opacity:.82}
.dleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.dleg span{display:inline-flex;align-items:center;gap:6px}.dleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13px;padding:1px 0;cursor:default}
.hb-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.hb-t{height:10px;background:var(--surface-2);border-radius:0 4px 4px 0;overflow:hidden}
.hb-f{display:block;height:100%;background:var(--c1);border-radius:0 4px 4px 0}
.hb:hover .hb-f{filter:brightness(1.1)}
.hb-v{font-size:12.5px;color:var(--ink-2);min-width:64px;text-align:right}
.tscroll{overflow-x:auto}
.dtab{width:100%;border-collapse:collapse;font-size:13px}
.dtab th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.dtab td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.dtab .num{text-align:right}
.dtab tbody tr:hover{background:var(--surface-2)}
.crit-pill{background:var(--crit-soft)!important;color:var(--crit)!important}
.dash-lnk{border:0;background:none;color:var(--accent);cursor:pointer;padding:0 0 0 4px;text-decoration:underline;font:inherit}
.dash-como{padding:12px 16px;margin-top:14px}
.dash-como summary{cursor:pointer}
.dash-como ol{margin:10px 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.dtip{position:fixed;z-index:80;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:7px;font-size:12.5px;pointer-events:none;box-shadow:var(--shadow);max-width:280px;font-variant-numeric:tabular-nums}
.dtip b{display:block;font-weight:600;margin-bottom:2px}
@media (max-width:560px){.hb{grid-template-columns:minmax(0,1fr) auto}.hb-t{grid-column:1/-1;grid-row:2}.dk-v{font-size:21px}}

/* frete x receita */
.fsrcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:10px;margin-bottom:14px}
.fsrc{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fsrc-t{display:flex;align-items:center;gap:8px}
.fsrc-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.fsrc-a .ico{width:16px;height:16px}
.segchips{align-items:center;margin-bottom:4px}
.segchips .lbl{margin-right:4px}
.bdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;margin-right:6px;vertical-align:baseline}
.dk-v .bdot{width:14px;height:14px}
.dk-okk .dk-v{color:var(--ok)}
.dk-sem .dk-v{color:var(--ink-3)}
.regra-box{display:flex;justify-content:space-between;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:10px 14px;border:1px dashed var(--line-2);border-radius:10px}
.rg-leg{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-2)}
.rg-leg span{display:inline-flex;align-items:center}
.rg-ed summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
.rg-f{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:8px}
.rg-f label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
.rg-f input{width:110px}
.alertas ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.alertas li{display:flex;align-items:baseline}
.bfield{display:flex;flex-wrap:wrap;gap:18px 10px;align-items:flex-end;justify-content:center;padding:10px 0 18px}
.bub{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:4px;border-radius:12px;width:max(calc(var(--d) + 8px),104px);color:var(--ink);font:inherit;text-align:center}
button.bub{cursor:pointer}
button.bub:hover .bub-c{transform:scale(1.04)}
.bub-c{width:var(--d);height:var(--d);border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--cor) 16%,var(--surface));border:2.5px solid var(--cor);transition:transform .15s}

function h(tag,props,...kids){
  const el=document.createElement(tag);let val;
  if(props)for(const [k,v] of Object.entries(props)){
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k==='style')el.style.cssText=v;
    else if(k==='value')val=v;
    else if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2),v);
    else if(typeof v==='boolean')el[k]=v;
    else el.setAttribute(k,v);
  }
  for(const c of kids.flat(9)){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)))}
  if(val!==undefined)el.value=val;
  return el;
}

/* Resultado de SLA por status do fluxo: soma (descontando o tempo em outros status) ou cada passagem */
function slaDe(t){
  const agora=Date.now();const out=[];
  for(const s of fluxoArea(t.areaId)){
    if(!s.slaMin||!s.slaModo)continue;
    const segs=(t.tempos||[]).filter(x=>x.status===s.id);if(!segs.length)continue;
    const dur=x=>(x.fim||agora)-x.inicio;
    if(s.slaModo==='cada'){segs.forEach((x,i)=>{const meta=s.slaMin*60000;out.push({st:s,meta,real:dur(x),andamento:!x.fim,ok:dur(x)<=meta,passagem:i+1,inicio:x.inicio})})}
    else{const meta=s.slaMin*60000*(s.slaModo==='op'?nOps(t):1);const real=segs.reduce((n,x)=>n+dur(x),0);
      const outros=(t.tempos||[]).filter(x=>x.status!==s.id&&x.inicio>=segs[0].inicio&&(!segs[segs.length-1].fim||x.inicio<segs[segs.length-1].fim)).reduce((n,x)=>n+dur(x),0);
      out.push({st:s,meta,real,andamento:segs.some(x=>!x.fim),ok:real<=meta,descontado:outros,passagens:segs.length,ops:s.slaModo==='op'?nOps(t):null,inicio:segs[0].inicio,fim:segs.every(x=>x.fim)?Math.max(...segs.map(x=>x.fim)):null})}
  }
  return out;
}

function brlC(v){const a=Math.abs(v);if(a>=1e6)return 'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:a>=1e7?1:2})+' mi';if(a>=1e4)return 'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil';return brl(v)}

function dNum(v){if(typeof v==='number')return v;let s=String(v??'').replace(/[R$\s]/g,'');if(!s)return 0;
  if(/,\d{1,3}$/.test(s)||/\.\d{3},/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');const n=parseFloat(s);return isNaN(n)?0:n}
function dataBR(v){if(v instanceof Date&&!isNaN(v))return new Date(v.getFullYear(),v.getMonth(),v.getDate(),12).getTime();
  if(typeof v==='number'&&v>20000&&v<80000)return Math.round((v-25569)*864e5)+12*36e5;

  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3],12).getTime();

/* ---------- leitura da planilha ---------- */
function lerPlanilha(buf,tipo){
  if(!window.XLSX)throw new Error('O leitor de planilhas ainda está carregando. Tente de novo em alguns segundos.');
  const S=DSH[tipo];const wb=XLSX.read(buf,{type:'array',cellDates:true});let melhor=null;
  for(const nome of wb.SheetNames){const linhas=XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1,raw:true,defval:''});
    for(let i=0;i<Math.min(20,linhas.length);i++){const cab=linhas[i].map(nrm);const mapa={};
      for(const [id,,,sin] of S.campos){let ix=cab.findIndex(c=>sin.includes(c));if(ix<0)ix=cab.findIndex(c=>c&&sin.some(s=>s.length>4&&c.startsWith(s)));if(ix>=0&&!Object.values(mapa).includes(ix))mapa[id]=ix}
      const n=Object.keys(mapa).length;if(!melhor||n>melhor.n)melhor={n,mapa,linhas,i,aba:nome,cab:linhas[i]}}}
  const falta=S.campos.filter(c=>c[2]&&!(melhor&&c[0] in melhor.mapa)).map(c=>c[1]);
  if(!melhor||falta.length)throw new Error(`Não encontrei a coluna ${falta.join(' e ')} na planilha. Confira o cabeçalho ou use a planilha modelo.`);
  const rows=[];
  for(const l of melhor.linhas.slice(melhor.i+1)){const o={};for(const [id] of S.campos){const ix=melhor.mapa[id];o[id]=ix==null?'':l[ix]}
    const d=dataBR(o.data);const v=dNum(o.valor);if(d==null||(!v&&!o.valor))continue;
    const r={d,v,f:String(o.filial??'').trim()};
    if(tipo==='frota')Object.assign(r,{pl:normPlaca(o.placa),ca:String(o.tipo||'').trim(),de:String(o.descricao||'').trim()});
    else if(tipo==='fretes')Object.assign(r,{tr:String(o.transportadora||'').trim(),ct:String(o.cte||'').trim(),sg:String(o.segmento||'').trim(),mv:dNum(o.mercadoria)});
    else if(tipo==='comercial')Object.assign(r,{ve:String(o.vendedor||'').trim(),cl:String(o.cliente||'').trim(),pr:String(o.produto||'').trim(),ca:String(o.categoria||'').trim(),pe:String(o.pedido||'').trim(),q:dNum(o.qtd),st:String(o.status||'').trim()});
    else Object.assign(r,{pl:normPlaca(o.placa),tv:String(o.tipoVeiculo||'').trim(),ca:String(o.categoria||'').trim(),fo:String(o.fornecedor||'').trim(),km:dNum(o.km),li:dNum(o.litros),en:dNum(o.entregas),de:String(o.descricao||'').trim()});
    rows.push(r)}
  if(!rows.length)throw new Error('A planilha não tem linhas com data e valor preenchidos.');
  const reconhecidas=S.campos.filter(c=>c[0] in melhor.mapa).map(c=>c[1]);
  return {rows,aba:melhor.aba,reconhecidas,ignoradas:S.campos.filter(c=>!(c[0] in melhor.mapa)).map(c=>c[1])};
}

async function msDashArquivo(tipo){return `${msBase()}/Dashboards/${DSH[tipo].arquivo}`}
async function carregarDash(tipo,forcar){
  if(dsh.carregando[tipo]||(dsh.dados[tipo]&&!forcar))return;
  dsh.carregando[tipo]=true;dsh.erro[tipo]=null;
  try{
    let res=null;
    if(MODO_MS&&MS.siteId){
      try{const it=await gx('GET',`/sites/${MS.siteId}/drive/root:/${encPath(await msDashArquivo(tipo))}`);
        const buf=await (await fetch(it['@microsoft.graph.downloadUrl'])).arrayBuffer();const p=lerPlanilha(buf,tipo);
        res={rows:p.rows,nome:it.name,em:Date.parse(it.lastModifiedDateTime),por:it.lastModifiedBy?.user?.displayName||'',aba:p.aba}}
      catch(e){if(e.status!==404)throw e}
    }else if(db){
      const m=await db.doc('dashboards/'+tipo).get();
      if(m.exists){const meta=m.data();const partes=await Promise.all(Array.from({length:meta.partes||0},(_,k)=>db.doc(`dashboards/${tipo}_p${k}`).get()));
        const js=partes.map(p=>p.exists?p.data().d:'').join('');res={rows:JSON.parse(js),nome:meta.nome,em:meta.em,por:meta.por,aba:meta.aba}}
    }
    dsh.dados[tipo]=res||exemploDash(tipo);
  }catch(e){console.warn(e);dsh.erro[tipo]=e.message||'Não foi possível ler a planilha.';dsh.dados[tipo]=exemploDash(tipo)}
  finally{dsh.carregando[tipo]=false;if(view==='dash')renderDash()}
}
async function enviarPlanilha(tipo,file,btn){
  const ok=/\.(xlsx|xlsm|xls|csv)$/i.test(file.name);if(!ok){toast('Use uma planilha .xlsx, .xls ou .csv.');return}
  const txt=btn.textContent;btn.disabled=true;btn.textContent='Lendo planilha…';
  try{
    const buf=await file.arrayBuffer();const p=lerPlanilha(buf,tipo);
    const por=(MODO_MS?meEmail.split('@')[0]:'')||(cfg.solicitantes||[]).find(x=>x.uid===meId)?.nome||'';
    const agora=Date.now();btn.textContent='Salvando…';
    if(MODO_MS&&MS.siteId){await gx('PUT',`/sites/${MS.siteId}/drive/root:/${encPath(await msDashArquivo(tipo))}:/content`,new Blob([buf]))}
    else if(db){const js=JSON.stringify(p.rows);const n=Math.ceil(js.length/PARTE);
      const ant=await db.doc('dashboards/'+tipo).get();const nAnt=ant.exists?(ant.data().partes||0):0;
      for(let k=0;k<n;k++)await db.doc(`dashboards/${tipo}_p${k}`).set({d:js.slice(k*PARTE,(k+1)*PARTE)});
      await db.doc('dashboards/'+tipo).set({partes:n,nome:file.name,em:agora,por:por||null,uid:meId||null,aba:p.aba,linhas:p.rows.length});
      for(let k=n;k<nAnt;k++){try{await db.doc(`dashboards/${tipo}_p${k}`).delete()}catch(e){}}}
    dsh.dados[tipo]={rows:p.rows,nome:file.name,em:agora,por,aba:p.aba};dsh.erro[tipo]=null;
    toast(`${intf(p.rows.length)} linhas carregadas${p.ignoradas.length?` · sem coluna para: ${p.ignoradas.join(', ')}`:''}.`);
    renderDash();
  }catch(e){console.warn(e);toast(e.message||'Não foi possível ler a planilha.');btn.disabled=false;btn.textContent=txt}
}

async function carregarLogo(file){
  if(!/^image\/(png|jpeg|webp|svg\+xml|gif)$/.test(file.type)){toast('Use uma imagem PNG, JPG, SVG ou WEBP.');return}
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const esc=Math.min(1,120/(img.naturalHeight||120),480/(img.naturalWidth||480));
  const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round((img.naturalWidth||480)*esc));cv.height=Math.max(1,Math.round((img.naturalHeight||120)*esc));
  const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cv.width,cv.height);
  let claro=cv.toDataURL('image/png'),escuro='';
  try{
    const d=ctx.getImageData(0,0,cv.width,cv.height),px=d.data;
    const opaco=[...Array(Math.min(px.length/4,4000)).keys()].every(i=>px[i*4+3]>250);
    if(opaco){ // fundo branco: torna transparente
      for(let i=0;i<px.length;i+=4){const r=px[i],g=px[i+1],b=px[i+2];const dd=Math.max(255-r,255-g,255-b);const a=Math.min(1,Math.max(0,(dd-8)/120));
        if(a<=0){px[i+3]=0;continue}for(let k=0;k<3;k++)px[i+k]=Math.min(255,Math.max(0,Math.round((px[i+k]-255*(1-a))/a)));px[i+3]=Math.round(a*255)}
      ctx.putImageData(d,0,0);claro=cv.toDataURL('image/png');
    }
    for(let i=0;i<px.length;i+=4){if(px[i+2]>px[i]+40&&px[i+2]>=px[i+1]){px[i]=px[i+1]=px[i+2]=255}}
    ctx.putImageData(d,0,0);escuro=cv.toDataURL('image/png');
  }catch(e){}
  draft.logo=claro;draft.logoEscuro=escuro;marcarSujo();renderConfig();
}

async function msProximoNumero(){
  const lid=await msLista('Contador',COLS_CONTADOR);
  await msChamados();const usados=new Set(Object.keys(MS.cache));
  for(let i=0;i<8;i++){
    const r=await gx('GET',`/sites/${MS.siteId}/lists/${lid}/items?$expand=fields($select=Title,N)&$top=50`);
    let it=(r.value||[]).find(x=>x.fields&&x.fields.Title==='chamados');
    if(!it){it=await gx('POST',`/sites/${MS.siteId}/lists/${lid}/items`,{fields:{Title:'chamados',N:0}})}
    const f=await gx('GET',`/sites/${MS.siteId}/lists/${lid}/items/${it.id}/fields`);
    let n=(parseInt(f.N,10)||0)+1;while(usados.has(String(n)))n++;
    try{await gx('PATCH',`/sites/${MS.siteId}/lists/${lid}/items/${it.id}/fields`,{N:n},i<5&&f['@odata.etag']?{'If-Match':f['@odata.etag']}:{});return String(n)}
    catch(e){if(e.status===412||e.status===409){await new Promise(r=>setTimeout(r,300+Math.random()*700));continue}throw e}
  }
  const e=new Error('contador');e.userMsg='Não foi possível gerar o número agora. Tente enviar de novo.';throw e;
}
async function msUpload(numero,f){
  const base=`/sites/${MS.siteId}/drive/root:/${encPath(msBase()+'/Anexos/'+numero+'/'+f.name.replace(/[\\/:*?"<>|#%]/g,'_'))}`;
  let it;
  if(f.size<=4*1024*1024){it=await gx('PUT',base+':/content?@microsoft.graph.conflictBehavior=rename',f)}
  else{
    const s=await gx('POST',base+':/createUploadSession',{item:{'@microsoft.graph.conflictBehavior':'rename'}});
    const CH=320*1024*16;let off=0;
    while(off<f.size){const end=Math.min(off+CH,f.size);
      const r=await fetch(s.uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes ${off}-${end-1}/${f.size}`},body:f.slice(off,end)});
      if(!r.ok){const e=new Error('upload');e.userMsg=`Falha ao enviar ${f.name}. Tente de novo.`;throw e}
      if(r.status===200||r.status===201)it=await r.json();off=end}
  }
  return {spId:it.id,url:it.webUrl};
}
async function msRefresh(){
  if(MS.carregando)return;MS.carregando=true;
  try{const l=(await msChamados()).sort((a,b)=>b.criadoEm-a.criadoEm);const snap={docs:l.map(o=>({data:()=>o}))};MS.subs.forEach(f=>f(snap));setBanner('')}
  catch(e){console.warn(e);setBanner('Não foi possível atualizar a fila agora. Confira a conexão; a página tenta de novo sozinha.')}
  finally{MS.carregando=false}
}
async function msCarregarCfg(){try{const c=await msLerConfig();const snap={exists:!!(c&&c.cfg),data:()=>c};MS.cfgSubs.forEach(f=>f(snap))}catch(e){console.warn(e)}}
function msDb(){
  return {
    doc(path){const i=path.indexOf('/');const col=path.slice(0,i),id=path.slice(i+1);return {
      async get(){if(col==='chamados'){const o=MS.cache[id];return {exists:!!o,data:()=>o}}if(col==='admin'){const c=await msLerConfig();return {exists:!!c,data:()=>c}}return {exists:false,data:()=>undefined}},
      async set(obj){if(col==='chamados'){await msSalvarChamado(obj);msRefresh()}else if(col==='admin'){await msSalvarConfig(obj);msCarregarCfg()}},
      async update(p){if(col==='chamados'){const o=mesclar(JSON.parse(JSON.stringify(MS.cache[id]||tickets.find(t=>String(t.numero)===id)||{})),p);await msSalvarChamado(o);msRefresh()}},
      async delete(){if(col==='chamados'){await msExcluirChamado(id);msRefresh()}},
      onSnapshot(next){if(col==='admin'){MS.cfgSubs.push(next);msCarregarCfg()}return ()=>{}}
    }},
    collection(){const q={orderBy(){return q},limit(){return q},onSnapshot(next){MS.subs.push(next);msRefresh();return ()=>{}}};return q}
  };
}
function telaMS(titulo,texto,...acoes){
  $('#tabs').replaceChildren();
  $('#main').replaceChildren(h('div',{class:'card done',style:'max-width:620px'},h('div',{class:'mark'+(cfg.logo?' logo':''),style:'margin-bottom:6px'},cfg.logo?h('img',{src:cfg.logo,alt:''}):'CA'),h('h2',{style:'font-size:24px',text:titulo}),h('p',{class:'muted',style:'margin:0',text:texto}),...acoes));
}
function msSair(){try{MS.msal.logoutRedirect({account:MS.account})}catch(e){location.reload()}}
async function msInstalar(btn){
  btn.disabled=true;btn.textContent='Instalando…';
  try{
    await msLista('Chamados',COLS_CHAMADOS);await msLista('Contador',COLS_CONTADOR);
    let inicial=null;try{const r=await fetch('config-inicial.json',{cache:'no-store'});if(r.ok)inicial=await r.json()}catch(e){}
    const c=migrar(clone((inicial&&(inicial.cfg||inicial))||MODELO));
    await msSalvarConfig({cfg:c,atualizadoEm:Date.now(),por:meEmail});
    location.reload();
  }catch(e){btn.disabled=false;btn.textContent='Tentar de novo';toast('Não foi possível instalar: '+(e.message||e))}
}
async function msBoot(){
  const C=window.CENTRAL_CFG;
  if(!window.msal){telaMS('Não foi possível carregar o login','A biblioteca de login da Microsoft não carregou. Confira a internet e recarregue a página.');return}
  if(!C.clientId||!C.tenantId||!C.site){telaMS('Falta configurar','Preencha tenantId, clientId e site no arquivo config.js (veja o guia de instalação).');return}
  try{
    MS.msal=new msal.PublicClientApplication({auth:{clientId:C.clientId,authority:'https://login.microsoftonline.com/'+C.tenantId,redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
    if(MS.msal.initialize)await MS.msal.initialize();
    const res=await MS.msal.handleRedirectPromise();
    MS.account=(res&&res.account)||MS.msal.getAllAccounts()[0]||null;
  }catch(e){telaMS('Erro no login',String(e.message||e),h('button',{class:'btn primary',onclick:()=>location.reload()},'Recarregar'));return}
  if(!MS.account){telaMS('Central de Atendimento','Entre com o seu e-mail para abrir ou acompanhar solicitações. Quem é de fora da empresa recebe um código no e-mail.',h('button',{class:'btn primary',onclick:()=>MS.msal.loginRedirect({scopes:MS_ESCOPOS})},'Entrar com e-mail Microsoft'));return}
  MS.msal.setActiveAccount(MS.account);
  meEmail=lc(MS.account.username);meId=meEmail;runtime=true;montarUserChip();
  telaMS('Carregando a central…','Conectando ao SharePoint.');
  try{const site=await gx('GET',`/sites/${C.site.replace(/^https?:\/\//,'').replace(/\/$/,'').replace(/^([^/]+)/,'$1:')}`);MS.siteId=site.id}
  catch(e){telaMS('Sem acesso ao site da central',`Seu usuário (${meEmail}) ainda não tem acesso ao site do SharePoint da central. Peça ao administrador para compartilhar o site com você.`,h('p',{class:'small muted',text:String(e.message||'')}),h('button',{class:'btn',onclick:msSair},'Entrar com outra conta'));return}
  const admins=(C.admins||[]).map(lc);
  let c0=null;try{c0=await msLerConfig()}catch(e){}
  if(!c0||!c0.cfg){
    if(admins.includes(meEmail)){const b=h('button',{class:'btn primary',onclick:()=>msInstalar(b)},'Instalar a central');telaMS('Primeira instalação','Vou criar no SharePoint a lista de chamados, o contador e a pasta de anexos, e carregar a configuração que você montou.',b)}
    else telaMS('Central ainda não instalada','O administrador precisa abrir a central uma vez para concluir a instalação.');
    return;
  }
  cfg=migrar(clone(c0.cfg));cfgExiste=true;
  const eu=(cfg.solicitantes||[]).find(x=>lc(x.email)===meEmail&&x.ativo!==false);
  mePapel=admins.includes(meEmail)?'admin':(eu?(eu.perfil||'solicitante'):null);
  if(!mePapel){aplicarMarca(cfg);telaMS('Acesso não liberado',`O e-mail ${meEmail} não está cadastrado na central. Peça ao administrador para incluir você em Configurar → Solicitantes.`,h('button',{class:'btn',onclick:msSair},'Entrar com outra conta'));return}
  podeAdmin=mePapel==='admin';ehEquipe=mePapel!=='solicitante';
  if(!ehEquipe&&view==='indicadores')view='painel';
  if(view==='config'&&!podeAdmin)view='abrir';
  db=msDb();assets=null;dl=null;user=null;
  ligarBanco();montarUserChip();render();
  setInterval(()=>{if(document.visibilityState==='visible')msRefresh()},20000);
  setInterval(()=>{if(document.visibilityState==='visible'&&!draftDirty&&!formDirty)msCarregarCfg()},120000);
}

/* ===================== Inicialização ===================== */
render();
(async()=>{
  if(MODO_MS){msBoot();return}
  const c=window.claude;
  if(!c||typeof c.use!=='function'){podeAdmin=true;setBanner('Modo demonstração: nada do que for enviado aqui fica salvo.');render();return}
  runtime=true;
  const [d,u,a,w]=await Promise.all([c.use('db'),c.use('user'),c.use('assets'),c.use('downloads')].map(p=>p.catch(()=>null)));
  db=d;user=u;assets=a;dl=w;
  if(user){try{meId=await user.id();podeAdmin=(await user.isOwner())||(await user.canEdit())}catch(e){}}
  if(!db){setBanner('O banco da central não está disponível nesta visualização. Você pode navegar, mas o que for enviado não fica salvo.');podeAdmin=podeAdmin||!user;if(view==='config'&&!podeAdmin)view='abrir';render();return}
  ligarBanco();
  if(view==='config'&&!podeAdmin)view='abrir';
  render();
})();
function ligarBanco(){
  db.doc('admin/config').onSnapshot(s=>{
    if(s.exists&&s.data().cfg){cfg=migrar(clone(s.data().cfg));cfgExiste=true}else{cfgExiste=false}
    if(view==='config'&&!draftDirty)draft=clone(cfg);
    renderTabs();
    if(view==='abrir'&&!formDirty)renderAbrir();
    else if(view==='config'&&!draftDirty)renderConfig();
    else if(view==='config')paintBar();
  },()=>{});
  db.collection('chamados').orderBy('criadoEm','desc').limit(1000).onSnapshot(s=>{
    tickets=s.docs.map(x=>x.data());
    renderTabs();
    if(view==='indicadores')renderIndicadores();
    if(view==='dash')renderDash();
    if(view==='painel'){
      const ativo=document.activeElement;const id=ativo&&ativo.id;
      if(id==='d-coment'||String(id||'').startsWith('d-resp')||id==='busca'||id==='busca-nota'){ /* não interromper quem está digitando */
        const t=tickets.find(t=>t.numero===ticketSel);const tl=document.getElementById('timeline');if(t&&tl)pintarHistorico(t,tl);
      }else renderPainel();
    }
  },e=>{setBanner('A conexão com a fila caiu. Recarregue a página para voltar a receber atualizações.')});
}
