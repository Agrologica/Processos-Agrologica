<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>Central de Atendimento Operacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --brand:#0D2B4E; --hl:#EE6A1F; --title:var(--brand);
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EBEFF4; --ink:#1A2230; --ink-2:#4F5B6B; --ink-3:#737F8E;
  --line:#D8DEE6; --line-2:#C2CAD5;
  --accent:var(--brand); --accent-ink:#FFFFFF; --accent-soft:color-mix(in srgb,var(--brand) 12%,#FFFFFF);
  --warn:#9A6212; --warn-soft:#FAEFD9; --crit:#B42318; --crit-soft:#FBE4E1;
  --ok:#2A7549; --ok-soft:#DCEFE3; --info:#2B63A3; --info-soft:#DDE8F5; --mute-soft:#E7EAEA;
  --shadow:0 12px 32px rgba(18,40,40,.14);
  --f-display:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --surface:#181E26; --surface-2:#212833; --ink:#E6EAF0; --ink-2:#A3ADBA; --ink-3:#7D8796;
    --line:#2B3340; --line-2:#3B4555;
    --accent:color-mix(in srgb,var(--brand) 62%,#FFFFFF); --accent-ink:#0E131A; --title:var(--ink); --accent-soft:color-mix(in srgb,var(--brand) 26%,#181E26);
    --warn:#E5AB4E; --warn-soft:#382A12; --crit:#F2766B; --crit-soft:#3D1B19;
    --ok:#62C48C; --ok-soft:#163324; --info:#86B4EA; --info-soft:#1A2B41; --mute-soft:#232E30;
    --shadow:0 12px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --surface:#181E26; --surface-2:#212833; --ink:#E6EAF0; --ink-2:#A3ADBA; --ink-3:#7D8796;
  --line:#2B3340; --line-2:#3B4555;
  --accent:color-mix(in srgb,var(--brand) 62%,#FFFFFF); --accent-ink:#0E131A; --title:var(--ink); --accent-soft:color-mix(in srgb,var(--brand) 26%,#181E26);
  --warn:#E5AB4E; --warn-soft:#382A12; --crit:#F2766B; --crit-soft:#3D1B19;
  --ok:#62C48C; --ok-soft:#163324; --info:#86B4EA; --info-soft:#1A2B41; --mute-soft:#232E30;
  --shadow:0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0;min-height:100%;display:flex;flex-direction:column}
.wrap{flex:1;width:100%}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:0;margin:0;text-wrap:balance;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.lbl{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);box-shadow:0 1px 0 var(--line);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px 0}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.mark{min-width:34px;height:34px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:14px;padding:0 6px}
.mark.logo{background:none;padding:0;height:auto;min-width:0}
.mark.logo img{height:58px;width:auto;max-width:200px;object-fit:contain}
.lg-escuro{display:none!important}
@media (max-width:560px){.mark.logo{flex:0 0 auto}.mark.logo img{height:40px;max-width:100px}.brand{min-width:0}.brand>div:last-child{min-width:0}.brand h1{font-size:16px!important;line-height:1.2}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-claro{display:none!important}:root:not([data-theme="light"]) .lg-escuro{display:block!important}}
:root[data-theme="dark"] .lg-claro{display:none!important}
:root[data-theme="dark"] .lg-escuro{display:block!important}
.brand .empresa{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.foot{margin:40px -16px 0;padding-inline:16px;background:var(--brand);color:#fff;position:relative;border-top:4px solid var(--hl);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot-in{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;padding-block:18px}
.valor{display:flex;align-items:center;gap:12px;padding:6px 18px;border-left:1px solid rgba(255,255,255,.22)}
.valor:first-child{border-left:0;padding-left:0}
.valor svg{width:38px;height:38px;color:var(--hl);flex:none}
.valor span{font-weight:700;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;line-height:1.25;max-width:17ch}
.foot-sub{max-width:1240px;margin:0 auto;padding:10px 0 14px;border-top:1px solid rgba(255,255,255,.14);font-size:12px;color:rgba(255,255,255,.72);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* cabeçalho com curva */
.top{overflow:hidden}
.top .swoosh{position:absolute;left:0;top:0;height:100%;width:64px;pointer-events:none}
.top-in{position:relative;padding-left:46px;max-width:none}
/* hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 32px;overflow:hidden;margin-bottom:22px}
.hero::after{content:"";position:absolute;left:-70px;bottom:-110px;width:320px;height:160px;border-top:3px solid var(--hl);border-radius:160px 160px 0 0;opacity:.85;pointer-events:none}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--hl)}
.hero h2{font-size:34px;color:var(--title);line-height:1.1;margin-top:6px}
.hero p{color:var(--ink-2);margin:10px 0 0;max-width:46ch;font-size:15px}
.hero .facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px}
.hero .fact{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.hero .fact svg{width:20px;height:20px;color:var(--hl)}
.orbit{position:relative;width:470px;height:420px;margin:0 auto}
.orbit svg.lines{position:absolute;inset:0;width:100%;height:100%}
.hub{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;text-align:center;box-shadow:0 0 0 6px var(--surface),0 0 0 8px var(--hl)}
.hub svg{width:42px;height:42px}
.hub-logo{background:#fff;color:#0D2B4E;width:150px;height:150px;margin:-75px 0 0 -75px}
.hub-logo img{width:112px;height:auto;display:block;margin:0 auto}
.hub-logo b{font-size:11.5px;color:#0D2B4E}
.hub-logo.on-brand{background:var(--brand)}
.hub-logo.on-brand b{color:#fff}
.hub b{display:block;font-size:12.5px;line-height:1.15;margin-top:4px;font-weight:600}
.hub-cli{width:172px;height:172px;margin:-86px 0 0 -86px;background:var(--surface);padding:0;overflow:visible}
.hub-cli img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.hub-folha{width:220px;height:195px;margin:-97px 0 0 -110px;background:none!important;box-shadow:none!important;border-radius:0}
.hub-folha img{object-fit:contain;border-radius:0;filter:drop-shadow(0 6px 14px rgba(13,43,78,.22))}
.hub-folha .cli-tag{bottom:-6px}
@media (max-width:560px){.hub-folha{width:170px;height:151px;margin:-75px 0 0 -85px}}
.hub-cli .cli-tag{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);background:var(--hl);color:#fff;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding:5px 12px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.node{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:var(--surface);border:2px solid var(--hl);color:var(--accent);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.node:hover,.node:focus-visible{transform:scale(1.08);background:var(--hl);color:#fff}
.node svg{width:28px;height:28px}
.node.up .nl{top:auto;bottom:70px}
.node .nl{position:absolute;top:70px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:600;color:var(--ink-2);pointer-events:none}
.ico{width:22px;height:22px}
.areas-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.areas-h h3{font-size:18px}
.area .badge svg{width:22px;height:22px}
.icons{display:flex;flex-wrap:wrap;gap:6px}
.icons button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icons button[aria-pressed="true"]{border-color:var(--hl);color:var(--hl);box-shadow:0 0 0 2px color-mix(in srgb,var(--hl) 25%,transparent)}
.icons svg{width:22px;height:22px}
.logoprev{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logoprev .box{height:56px;min-width:120px;border:1px dashed var(--line-2);border-radius:8px;display:grid;place-items:center;padding:6px 10px;background:var(--surface)}
.logoprev .box.dk{background:var(--brand)}
.logoprev img{max-height:44px;max-width:200px}
.colorin{display:flex;gap:8px;align-items:center}
.colorin input[type=color]{width:42px;height:34px;border:1px solid var(--line-2);border-radius:6px;padding:2px;background:var(--surface)}
.brand h1{font-size:20px}
.brand .sub{font-size:12px;color:var(--ink-2);line-height:1.2}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;align-self:flex-end}
.tab{border:0;background:none;padding:10px 14px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hl)}
.count{font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);border-radius:10px;padding:1px 7px}
.tab[aria-selected="true"] .count{background:var(--accent-soft);color:var(--accent)}

.eqbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.eqbar .lbl{margin-right:4px}
.eqchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 6px 4px 11px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
.eqchip.zero{color:var(--ink-3);font-weight:500}
.eqchip:hover{border-color:var(--ink-3)}
.eqchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.eqchip[aria-pressed="true"] .count{background:color-mix(in srgb,var(--accent-ink) 22%,transparent);color:var(--accent-ink)}
.resp{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);margin-top:2px;min-width:0}
.resp .ico{width:14px;height:14px;color:var(--hl);flex:none}
.resp b{font-weight:600;color:var(--ink)}
.resp.sem{color:var(--ink-3);font-style:italic}
.dtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.overlay{position:fixed;inset:0;z-index:55;background:rgba(13,43,78,.5);display:flex;justify-content:center;align-items:flex-start;padding:36px 16px;overflow-y:auto;overscroll-behavior:contain;animation:ovin .15s ease-out}
.overlay .detail{position:relative!important;inset:auto!important;top:auto!important;max-height:none!important;overflow:visible;width:min(920px,100%);border-radius:12px!important;box-shadow:0 24px 64px rgba(0,0,0,.3);z-index:auto;padding-top:0!important}
.overlay.cheia{padding:0}
.overlay.cheia .detail{width:100%;min-height:100%;border-radius:0!important;border:0}
.overlay .closeD{display:none}
body.modal-aberto{overflow:hidden}
@keyframes ovin{from{opacity:0}to{opacity:1}}
@media (max-width:720px){.overlay{padding:0}.overlay .detail{width:100%;min-height:100%;border-radius:0!important;border:0}.overlay .dtools .btn{display:none}}
.anxexist{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.file.rem .fn{text-decoration:line-through;opacity:.55}
.banner{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);font-size:13px}
main{padding-top:22px}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:6px;border-radius:6px;line-height:1;font-size:15px}
.iconbtn:hover{color:var(--ink);background:var(--surface-2)}
.iconbtn:disabled{opacity:.35;cursor:default;background:none}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;min-height:38px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:13px;font-weight:500;color:var(--ink-2)}
.field .req{color:var(--crit);margin-left:2px}
.field.err input,.field.err select,.field.err textarea,.field.err .drop{border-color:var(--crit)}
.field .errmsg{font-size:12px;color:var(--crit)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 16px}
.yn{display:flex;gap:8px}
.yn label{flex:1;display:flex;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;cursor:pointer;background:var(--surface)}
.yn input{accent-color:var(--accent)}

/* pills */
.stc{min-width:0;display:flex}
.stc .pill{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-novo{background:var(--info-soft);color:var(--info)}
.s-atend{background:var(--accent-soft);color:var(--accent)}
.s-aguard{background:var(--warn-soft);color:var(--warn)}
.s-concl{background:var(--ok-soft);color:var(--ok)}
.s-canc{background:var(--mute-soft);color:var(--ink-3)}
.p-urg{color:var(--crit);font-weight:600}
.p-alta{color:var(--warn);font-weight:600}
.tag{font-size:11.5px;border:1px solid var(--line-2);border-radius:5px;padding:0 6px;color:var(--ink-3)}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}

/* ABRIR */
.tab .tl-c{display:none}
.man-sec{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;padding:16px 18px}
.man-h h3{font-size:17px;color:var(--title)}.man-h p{margin:2px 0 0}
.man-l{display:flex;flex-direction:column}
.man-it{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line,#E2E7EE)}
.man-it:first-child{border-top:0}
.man-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--brand)}
.man-ic svg{width:22px;height:22px}
.man-tx{display:flex;flex-direction:column;min-width:0}.man-tx b{font-size:15px;color:var(--ink)}
.man-bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:520px){.man-it{grid-template-columns:auto 1fr}.man-bt{grid-column:2;justify-content:flex-start}}
.intro{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap;margin-bottom:18px}
.intro h2{font-size:24px}
.intro p{margin:4px 0 0;color:var(--ink-2);max-width:60ch}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.area{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:12px;min-width:0}
.area .badge{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;letter-spacing:.03em;flex:none}
.area .txt{min-width:0;display:flex;flex-direction:column}
.area h3{font-size:16px!important}
.area .sla{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.area:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.area .code{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.area p{margin:0;color:var(--ink-2);font-size:13px}
.area .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.formwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.form{padding:22px;display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec + .sec{border-top:1px solid var(--line);padding-top:20px}
.sec h3{font-size:17px}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);background:none;border:0;cursor:pointer;padding:0;margin-bottom:10px}
.back:hover{color:var(--ink)}
.formhead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.formhead h2{font-size:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.field{flex-direction:row;align-items:center}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.drop{border:1.5px dashed var(--line-2);border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .name{font-weight:500}
.filelist{display:flex;flex-direction:column;gap:6px;width:100%}
.file{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aside{padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:90px}
.aside h3{font-size:16px}
.aside ol{margin:0;padding-left:18px;color:var(--ink-2);font-size:13px;display:flex;flex-direction:column;gap:4px}
.instr{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.submitrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.done{padding:36px 28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:560px;margin:20px auto}

const nrm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mesKey=ms=>{const d=new Date(ms);return d.getFullYear()*100+d.getMonth()};
const mesNome=k=>`${MESES[k%100]}/${String(Math.floor(k/100)).slice(2)}`;
function brlC(v){const a=Math.abs(v);if(a>=1e6)return 'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:a>=1e7?1:2})+' mi';if(a>=1e4)return 'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil';return brl(v)}
const intf=v=>Math.round(v||0).toLocaleString('pt-BR');
function dNum(v){if(typeof v==='number')return v;let s=String(v??'').replace(/[R$\s]/g,'');if(!s)return 0;
  if(/,\d{1,3}$/.test(s)||/\.\d{3},/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');const n=parseFloat(s);return isNaN(n)?0:n}
function dataBR(v){if(v instanceof Date&&!isNaN(v))return new Date(v.getFullYear(),v.getMonth(),v.getDate(),12).getTime();
  if(typeof v==='number'&&v>20000&&v<80000)return Math.round((v-25569)*864e5)+12*36e5;
  const s=String(v??'').trim();let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){const y=+m[3]<100?2000+ +m[3]:+m[3];return new Date(y,+m[2]-1,+m[1],12).getTime()}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3],12).getTime();
  m=s.match(/^(\d{1,2})[\/-](\d{4})$/);if(m)return new Date(+m[2],+m[1]-1,1,12).getTime();return null}

/* Algumas planilhas do sistema vêm com a área (!ref) errada e a leitura pula a 1ª linha (o cabeçalho). Recalcula a área pelas células reais. */
function xlsRef(ws){if(!ws)return ws;let r0=1e9,r1=-1,c0=1e9,c1=-1;for(const k in ws){if(k[0]==='!')continue;const a=XLSX.utils.decode_cell(k);if(a.r<r0)r0=a.r;if(a.r>r1)r1=a.r;if(a.c<c0)c0=a.c;if(a.c>c1)c1=a.c}
  if(r1>=0)ws['!ref']=XLSX.utils.encode_range({s:{r:r0,c:c0},e:{r:r1,c:c1}});return ws}
/* ---------- leitura da planilha ---------- */
function lerPlanilha(buf,tipo){
  if(!window.XLSX)throw new Error('O leitor de planilhas ainda está carregando. Tente de novo em alguns segundos.');
  const S=DSH[tipo];const wb=XLSX.read(buf,{type:'array',cellDates:true});let melhor=null;
  for(const nome of wb.SheetNames){const linhas=XLSX.utils.sheet_to_json(xlsRef(wb.Sheets[nome]),{header:1,raw:true,defval:''});
    for(let i=0;i<Math.min(20,linhas.length);i++){const cab=linhas[i].map(nrm);const mapa={};
      for(const [id,,,sin] of S.campos){let ix=cab.findIndex(c=>sin.includes(c));if(ix<0)ix=cab.findIndex(c=>c&&sin.some(s=>s.length>4&&c.startsWith(s)));if(ix>=0&&!Object.values(mapa).includes(ix))mapa[id]=ix}
      if(tipo==='fretes'&&mapa.transportadora!=null){const k2=cab.findIndex((c,k)=>c==='nome'&&k>mapa.transportadora&&!Object.values(mapa).includes(k));if(k2>=0)mapa.parte=k2}
      const n=Object.keys(mapa).length;if(!melhor||n>melhor.n)melhor={n,mapa,linhas,i,aba:nome,cab:linhas[i]}}}
  const falta=S.campos.filter(c=>c[2]&&!(melhor&&c[0] in melhor.mapa)).map(c=>c[1]);
  if(!melhor||falta.length)throw new Error(`Não encontrei a coluna ${falta.join(' e ')} na planilha. Confira o cabeçalho ou use a planilha modelo.`);
  const rows=[];
  for(const l of melhor.linhas.slice(melhor.i+1)){const o={};for(const [id] of S.campos){const ix=melhor.mapa[id];o[id]=ix==null?'':l[ix]}
    o.parte=melhor.mapa.parte==null?'':l[melhor.mapa.parte];
    const d=dataBR(o.data);const v=dNum(o.valor);if(d==null||(!v&&!o.valor))continue;
    const r={d,v,f:String(o.filial??'').trim()};
    if(tipo==='frota')Object.assign(r,{pl:normPlaca(o.placa),ca:String(o.tipo||'').trim(),de:String(o.descricao||'').trim()});
    else if(tipo==='fretes')Object.assign(r,{tr:String(o.transportadora||'').trim(),ct:String(o.cte||'').trim(),sg:String(o.segmento||'').trim(),mv:dNum(o.mercadoria),pt:String(o.parte||'').trim(),cg:String(o.carga??'').trim()});
    else if(tipo==='comercial')Object.assign(r,{ve:String(o.vendedor||'').trim(),cl:String(o.cliente||'').trim(),pr:String(o.produto||'').trim(),ca:String(o.categoria||'').trim(),pe:String(o.pedido||'').trim(),q:dNum(o.qtd),st:String(o.status||'').trim()});
    else Object.assign(r,{pl:normPlaca(o.placa),tv:String(o.tipoVeiculo||'').trim(),ca:String(o.categoria||'').trim(),fo:String(o.fornecedor||'').trim(),km:dNum(o.km),li:dNum(o.litros),en:dNum(o.entregas),de:String(o.descricao||'').trim()});
    rows.push(r)}
  if(!rows.length)throw new Error('A planilha não tem linhas com data e valor preenchidos.');
  const reconhecidas=S.campos.filter(c=>c[0] in melhor.mapa).map(c=>c[1]);
  return {rows,aba:melhor.aba,reconhecidas,ignoradas:S.campos.filter(c=>!(c[0] in melhor.mapa)).map(c=>c[1])};
}

/* ---------- armazenamento ---------- */
async function msDashArquivo(tipo){return `${msBase()}/Dashboards/${DSH[tipo].arquivo}`}
async function carregarDash(tipo,forcar){
  if(dsh.carregando[tipo]||(dsh.dados[tipo]&&!forcar))return;
  dsh.carregando[tipo]=true;dsh.erro[tipo]=null;
  try{
    let res=null;
    if(MODO_MS&&MS.siteId){
      try{const it=await gx('GET',`/sites/${MS.siteId}/drive/root:/${encPath(await msDashArquivo(tipo))}`);
        const buf=await (await fetch(it['@microsoft.graph.downloadUrl'])).arrayBuffer();const p=lerPlanilha(buf,tipo);
        res={rows:p.rows,nome:it.name,em:Date.parse(it.lastModifiedDateTime),por:it.lastModifiedBy?.user?.displayName||'',aba:p.aba}}
      catch(e){if(e.status!==404)throw e}
    }else if(db){
      const m=await db.doc('dashboards/'+tipo).get();
      if(m.exists){const meta=m.data();const partes=await Promise.all(Array.from({length:meta.partes||0},(_,k)=>db.doc(`dashboards/${tipo}_p${k}`).get()));
        const js=partes.map(p=>p.exists?p.data().d:'').join('');res={rows:JSON.parse(js),nome:meta.nome,em:meta.em,por:meta.por,aba:meta.aba}}
    }
    dsh.dados[tipo]=res||exemploDash(tipo);
  }catch(e){console.warn(e);dsh.erro[tipo]=e.message||'Não foi possível ler a planilha.';dsh.dados[tipo]=exemploDash(tipo)}
  finally{dsh.carregando[tipo]=false;if(view==='dash')renderDash()}
}
async function enviarPlanilha(tipo,file,btn){
  const ok=/\.(xlsx|xlsm|xls|csv)$/i.test(file.name);if(!ok){toast('Use uma planilha .xlsx, .xls ou .csv.');return}
  const txt=btn.textContent;btn.disabled=true;btn.textContent='Lendo planilha…';
  try{
    const buf=await file.arrayBuffer();const p=lerPlanilha(buf,tipo);
    const por=(MODO_MS?meEmail.split('@')[0]:'')||(cfg.solicitantes||[]).find(x=>x.uid===meId)?.nome||'';
    const agora=Date.now();btn.textContent='Salvando…';
    if(MODO_MS&&MS.siteId){await gx('PUT',`/sites/${MS.siteId}/drive/root:/${encPath(await msDashArquivo(tipo))}:/content`,new Blob([buf]))}
    else if(db){const js=JSON.stringify(p.rows);const n=Math.ceil(js.length/PARTE);
      const ant=await db.doc('dashboards/'+tipo).get();const nAnt=ant.exists?(ant.data().partes||0):0;
      for(let k=0;k<n;k++)await db.doc(`dashboards/${tipo}_p${k}`).set({d:js.slice(k*PARTE,(k+1)*PARTE)});
      await db.doc('dashboards/'+tipo).set({partes:n,nome:file.name,em:agora,por:por||null,uid:meId||null,aba:p.aba,linhas:p.rows.length});
      for(let k=n;k<nAnt;k++){try{await db.doc(`dashboards/${tipo}_p${k}`).delete()}catch(e){}}}
    dsh.dados[tipo]={rows:p.rows,nome:file.name,em:agora,por,aba:p.aba};dsh.erro[tipo]=null;
    toast(`${intf(p.rows.length)} linhas carregadas${p.ignoradas.length?` · sem coluna para: ${p.ignoradas.join(', ')}`:''}.`);
    renderDash();
  }catch(e){console.warn(e);toast(e.message||'Não foi possível ler a planilha.');btn.disabled=false;btn.textContent=txt}
}

const manGrupoDe=n=>/^guia/i.test(n)?'guia':/apresenta|integra/i.test(n)?'int':'outro';

async function manPadrao(){
  if(man.padraoOk)return man.padraoOk;
  const r=await Promise.all(MANUAIS_PADRAO.map(async([arq,g,t,d])=>{const url='manuais/'+encodeURIComponent(arq);
    try{const x=await fetch(url,{method:'HEAD',cache:'no-store'});if(!x.ok)return null;const ct=x.headers.get('content-type')||'';if(/text\/html/i.test(ct))return null;
      return {id:'p:'+arq,nome:arq,grupo:g,titulo:t,desc:d,url,tamanho:+(x.headers.get('content-length')||0),origem:'padrao'}}catch(e){return null}}));
  man.padraoOk=r.filter(Boolean);return man.padraoOk;
}
async function manCarregar(forcar){
  if(man.carregando||(man.lista&&!forcar))return;man.carregando=true;man.erro=null;if(view==='manuais')renderManuais();
  try{
    let extra=[];
    if(MODO_MS&&MS.siteId){
      try{const r=await gx('GET',`/sites/${MS.siteId}/drive/root:/${encPath(msBase()+'/Manuais')}:/children?$select=id,name,size,webUrl,lastModifiedDateTime,file&$top=200`);
        extra=(r.value||[]).filter(f=>f.file||/\.[a-z0-9]+$/i.test(f.name)).map(f=>({id:'s:'+f.id,spId:f.id,nome:f.name,grupo:manGrupoDe(f.name),titulo:manTitulo(f.name),desc:'',url:f.webUrl,tamanho:f.size,em:f.lastModifiedDateTime?Date.parse(f.lastModifiedDateTime):0,origem:'sp'}))}
      catch(e){if(e.status!==404)throw e}
    }else if(db&&!MODO_MS){
      const d=await db.doc('manuais/lista').get();
      extra=((d.exists&&d.data().itens)||[]).map(f=>({...f,id:'a:'+f.asset,grupo:manGrupoDe(f.nome),titulo:manTitulo(f.nome),desc:'',origem:'asset'}));
    }
    const pad=await manPadrao();
    const nomes=new Set(extra.map(f=>lc(f.nome)));
    const padMap=new Map(MANUAIS_PADRAO.map(x=>[lc(x[0]),x]));
    extra.forEach(f=>{const x=padMap.get(lc(f.nome));if(x){f.grupo=x[1];f.titulo=x[2];f.desc=x[3]}});
    const ordem=n=>{const i=MANUAIS_PADRAO.findIndex(x=>lc(x[0])===lc(n));return i<0?999:i};
    man.lista=[...pad.filter(f=>!nomes.has(lc(f.nome))),...extra].sort((a,b)=>ordem(a.nome)-ordem(b.nome)||a.titulo.localeCompare(b.titulo,'pt-BR'));
  }catch(e){console.warn(e);man.erro='Não foi possível carregar os manuais agora. Tente de novo em instantes.';man.lista=man.lista||[]}
  finally{man.carregando=false;if(view==='manuais')renderManuais()}
}
async function manAbrir(f){
  if(f.origem==='asset'){abrirAnexo({asset:f.asset,nome:f.nome,tipoMime:f.tipoMime||'application/pdf'});return}
  if(f.origem==='padrao'&&dl){try{const r=await fetch(f.url);if(!r.ok)throw new Error(r.status);await dl.save({filename:f.nome,data:await r.blob()});return}catch(e){toast('Não foi possível abrir o manual agora.');return}}
  window.open(f.url,'_blank','noopener');
}
async function manEnviar(files,btn){
  const lista=[...files];if(!lista.length)return;
  const ruim=lista.find(f=>!/\.(pdf|docx|pptx|xlsx)$/i.test(f.name));if(ruim){toast('Envie o manual em PDF (ou DOCX, PPTX, XLSX).');return}
  man.enviando=true;renderManuais();
  try{
    if(MODO_MS){
      for(const f of lista){const base=`/sites/${MS.siteId}/drive/root:/${encPath(msBase()+'/Manuais/'+f.name.replace(/[\\/:*?"<>|#%]/g,'_'))}`;
        if(f.size<=4*1024*1024){await gx('PUT',base+':/content?@microsoft.graph.conflictBehavior=replace',f)}
        else{const s=await gx('POST',base+':/createUploadSession',{item:{'@microsoft.graph.conflictBehavior':'replace'}});const CH=320*1024*16;let off=0;
          while(off<f.size){const end=Math.min(off+CH,f.size);const r=await fetch(s.uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes ${off}-${end-1}/${f.size}`},body:f.slice(off,end)});if(!r.ok)throw new Error('upload');off=end}}}
    }else{
      if(!db||!assets){toast('Nesta visualização não dá para guardar arquivos.');return}
      const d=await db.doc('manuais/lista').get();let itens=(d.exists&&d.data().itens)||[];
      for(const f of lista){const r=await assets.upload(f);itens=itens.filter(x=>lc(x.nome)!==lc(f.name));itens.push({nome:f.name,asset:r.id,tamanho:f.size,tipoMime:f.type||'application/pdf',em:Date.now(),por:meEmail||''})}
      await db.doc('manuais/lista').set({itens});
    }
    toast(lista.length>1?`${lista.length} manuais adicionados.`:'Manual adicionado.');
  }catch(e){console.warn(e);toast('Não foi possível enviar o manual. Tente de novo.')}
  finally{man.enviando=false;await manCarregar(true)}
}
async function manExcluir(f){
  if(man.conf!==f.id){man.conf=f.id;renderManuais();setTimeout(()=>{if(man.conf===f.id){man.conf=null;if(view==='manuais')renderManuais()}},6000);return}
  man.conf=null;
  try{
    if(f.origem==='sp')await gx('DELETE',`/sites/${MS.siteId}/drive/items/${f.spId}`);
    else if(f.origem==='asset'){const d=await db.doc('manuais/lista').get();const itens=((d.exists&&d.data().itens)||[]).filter(x=>x.asset!==f.asset);await db.doc('manuais/lista').set({itens})}

  }catch(e){console.warn(e);toast('Não foi possível remover agora.')}
  await manCarregar(true);
}

async function msUpload(numero,f){

/* ===================== ESTEIRA DE SEMENTES (aba própria, uma linha por pedido/material, alimentada por planilha) =====================
   A carteira entra por planilha (Filial, Cliente, Material, Pedido de compra, Pedido de venda, Série, Quantidade). Cada importação só ACRESCENTA
   linhas novas; o que já existe (e o andamento de cada linha) é mantido. Consultor informa fazenda, ponto e data de entrega → Crédito libera →
   Compras informa fornecedor e local de carregamento → só então a Logística avança (contratação → carregamento → trânsito → finalizado). */
let sem=[],semOk=false;

function semPend(o){const p=[];if(!o.entrega)p.push('Calendarização');if(!(o.cred&&o.cred.ok===true))p.push('Crédito');if(!(o.comp&&o.comp.fornecedor&&o.comp.local))p.push('Compras');return p}

function semHash(s){let a=2166136261,b=5381;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,16777619);b=(Math.imul(b,33)^c)>>>0}return (a>>>0).toString(36)+b.toString(36)}
/* ---------- armazenamento ---------- */

/* ---------- leitura da planilha ---------- */
const semNrm=v=>itNorm(v).replace(/[.:_]/g,' ').replace(/\s+/g,' ').trim();
const SEM_SIN={filial:['filial','unidade'],cliente:['cliente','nome do cliente','razao social'],material:['material','produto','semente','descricao do material','descricao'],
  pvenda:['pedido de venda','pedido venda','ped venda','pv','pedido','ordem de venda'],pcompra:['pedido de compra','pedido compra','ped compra','pedido de compras','pc'],
  serie:['serie','serie do pedido','serie de pedido'],qtd:['quantidade','qtd','qtde','quant','volume'],venc:['data vencimento','vencimento','data de vencimento'],
  pterc:['ped terceiro','pedido terceiro','pedido de terceiro','ped terceiros'],forn:['fornecedor']};
function semLer(buf){
  if(!window.XLSX)throw new Error('O leitor de planilhas ainda está carregando. Tente de novo em alguns segundos.');
  const wb=XLSX.read(buf,{type:'array',cellDates:true});let melhor=null;
  for(const nome of wb.SheetNames){const linhas=XLSX.utils.sheet_to_json(xlsRef(wb.Sheets[nome]),{header:1,raw:true,defval:''});
    for(let i=0;i<Math.min(20,linhas.length);i++){const cab=linhas[i].map(semNrm);const mapa={};const usa=new Set();
      const acha=(sin,ap)=>{let ix=cab.findIndex((c,k)=>!usa.has(k)&&k>=(ap||0)&&sin.includes(c));if(ix<0)ix=cab.findIndex((c,k)=>!usa.has(k)&&k>=(ap||0)&&c&&sin.some(s=>s.length>4&&c.startsWith(s)));return ix};
      const pega=(id,ap)=>{const ix=acha(SEM_SIN[id],ap);if(ix>=0){mapa[id]=ix;usa.add(ix)}return ix};
      for(const id of ['pcompra','pterc','forn','venc','serie','qtd','material','cliente'])pega(id);
      pega('filial');const pv=pega('pvenda');
      /* layout com duas colunas "Pedido": a 1ª é o pedido de venda e a 2ª (mais à direita) é o pedido de compra */
      if(!('pcompra' in mapa)&&pv>=0){const p2=acha(SEM_SIN.pvenda,pv+1);if(p2>=0){mapa.pcompra=p2;usa.add(p2)}}
      const n=Object.keys(mapa).length;if(!melhor||n>melhor.n)melhor={n,mapa,linhas,i,aba:nome}}}
  if(!melhor||melhor.n<3||!('material' in melhor.mapa))throw new Error('Não reconheci as colunas. A planilha precisa ter Filial, Cliente, Produto/Material, Pedido e Quantidade/Volume (use a planilha modelo).');
  const mapa=new Map();const M=melhor.mapa;
  for(const l of melhor.linhas.slice(melhor.i+1)){const g=id=>M[id]==null?'':l[M[id]];
    const r={filial:String(g('filial')).trim(),cliente:String(g('cliente')).trim(),material:String(g('material')).trim(),pcompra:String(g('pcompra')).trim(),pvenda:String(g('pvenda')).trim(),serie:String(g('serie')).trim(),qtd:dNum(g('qtd'))||0,
      pterc:String(g('pterc')).trim(),forn:String(g('forn')).trim(),venc:(()=>{const d=dataBR(g('venc'));return d?new Date(d).toISOString().slice(0,10):''})()};
    if(!r.material&&!r.cliente&&!r.pvenda)continue;
    r.chave=itNorm([r.filial,r.pvenda||r.pcompra,r.serie,r.material].join('|'));
    const x=mapa.get(r.chave);
    if(x){x.qtd+=r.qtd;for(const k of ['pcompra','pterc','forn','venc'])if(!x[k]&&r[k])x[k]=r[k]}else mapa.set(r.chave,r)}
  if(!mapa.size)throw new Error('A planilha não tem linhas preenchidas.');
  const nomes={filial:'Filial',cliente:'Cliente',material:'Produto',pvenda:'Pedido',qtd:'Volume',pcompra:'Pedido de compra',pterc:'Ped. Terceiro',forn:'Fornecedor',venc:'Data Vencimento'};
  return {rows:[...mapa.values()],aba:melhor.aba,ignoradas:Object.keys(nomes).filter(k=>!(k in M)).map(k=>nomes[k])};
}
async function semImportar(file,btn){
  if(btn)btn.disabled=true;
  try{
    const p=semLer(await file.arrayBuffer());const agora=Date.now();const eu=trfEu();
    const exist=new Map(sem.map(o=>[o.chave,o]));
    let numero=sem.reduce((m,o)=>Math.max(m,+o.numero||0),0);
    const novas=[],atual=[];
    for(const r of p.rows){const e=exist.get(r.chave);
      if(!e){numero++;const o={id:'s'+semHash(r.chave),numero,chave:r.chave,criadoEm:agora,atualizadoEm:agora,importadoEm:agora,arquivo:file.name,por:eu,filial:up(r.filial),cliente:up(r.cliente),material:up(r.material),pcompra:r.pcompra,pterc:r.pterc,pvenda:r.pvenda,serie:r.serie,qtd:r.qtd,venc:r.venc,historico:[{em:agora,por:eu.nome,texto:up('IMPORTADA DA PLANILHA '+file.name)}]};
        if(r.forn)o.comp={fornecedor:up(r.forn),por:eu.nome,em:agora};novas.push(o)}
      else{const patch={};if(!e.pcompra&&r.pcompra)patch.pcompra=r.pcompra;if(!e.pterc&&r.pterc)patch.pterc=r.pterc;if(!e.venc&&r.venc)patch.venc=r.venc;
        if(r.forn&&!(e.comp&&e.comp.fornecedor))patch.comp={...(e.comp||{}),fornecedor:up(r.forn)};
        if(Object.keys(patch).length)atual.push([e,patch])}}
    await semCriarLote(novas);
    for(const [e,patch] of atual)await semAtualizar(e,patch,'DADOS DE COMPRA ATUALIZADOS PELA PLANILHA');
    const ja=p.rows.length-novas.length;
    toast(`${novas.length} linha${novas.length===1?'':'s'} nova${novas.length===1?'':'s'} importada${novas.length===1?'':'s'}${ja?` · ${ja} já existia${ja===1?'':'m'} (mantida${ja===1?'':'s'})`:''}${atual.length?` · ${atual.length} com dados de compra atualizados`:''}.`);
    if(p.ignoradas.length)setTimeout(()=>toast('Colunas não encontradas: '+p.ignoradas.join(', ')+'.'),3400);
  }catch(e){console.warn(e);toast(e&&e.message?e.message:'Não foi possível importar a planilha.')}
  if(btn)btn.disabled=false;paintSem();
}

/* Planilha padrão do sistema, lida por POSIÇÃO da coluna: A Filial · B Pedido · C Assinatura · D Série · E Emissão · G Safra · I Cliente · K CTC · L Data pagto · M R$ pedido · N Valor moeda · P Etapa aprov. · T Margem */

function asEtapa(v){const t=String(v??'').trim();if(!t)return '0 - Em branco';const n=Number(t.replace(',','.'));

const AS_ASS=['Sem assinatura','Assinado'];

function asFilial(c){const n=dFilial(c);return n===String(c).trim()&&AS_FIL_EXTRA[n]?AS_FIL_EXTRA[n]:n}

function asCodStr(v){if(typeof v==='number')return String(v);const s=String(v??'').trim();return /^\d+\.0+$/.test(s)?s.replace(/\.0+$/,''):s}
function asLer(buf){

  for(const nome of wb.SheetNames){const l=XLSX.utils.sheet_to_json(xlsRef(wb.Sheets[nome]),{header:1,raw:true,defval:''});
    const i=l.slice(0,20).findIndex(r=>nrm(r[AS_COL.p])==='pedido'&&nrm(r[AS_COL.f])==='filial');
    if(i>=0){linhas=l;i0=i;aba=nome;break}}
  if(!linhas)throw new Error('Não encontrei o cabeçalho da planilha padrão (coluna A = FILIAL e coluna B = PEDIDO). Use a planilha exportada do sistema.');
  const m=new Map();
  for(const l of linhas.slice(i0+1)){const pe=asCodStr(l[AS_COL.p]);if(!pe)continue;
    const mgRaw=l[AS_COL.mg];const mgTxt=String(mgRaw??'').trim();
    const r={f:asCodStr(l[AS_COL.f]),s:String(l[AS_COL.s]??'').trim(),p:pe,ems:dataBR(l[AS_COL.ems]),sf:String(l[AS_COL.sf]??'').trim(),cl:String(l[AS_COL.cl]??'').trim(),c:String(l[AS_COL.c]??'').trim(),pg:dataBR(l[AS_COL.pg]),v:dNum(l[AS_COL.v]),vm:dNum(l[AS_COL.vm]),et:asEtapa(l[AS_COL.et]),mg:mgTxt===''?null:(typeof mgRaw==='number'?mgRaw:dNum(mgTxt.replace('%',''))),mgp:/%/.test(mgTxt),ao:String(l[AS_COL.ao]??'').trim()};
    const k=[r.f,r.s,r.p].join('|');

    const x=m.get(k);x.v+=r.v||0;x.vm+=r.vm||0}
  const arr=[...m.values()];const fr=arr.filter(x=>x.mg!=null&&!x.mgp);

  const fracao=fr.length>0&&fr.every(x=>Math.abs(x.mg)<=1.5);
  const rows=arr.map(x=>{const mg=x.mg==null?null:Math.round((fracao&&!x.mgp?x.mg*100:x.mg)*100)/100;const {mgp,...y}=x;
    return {...y,mg,v:Math.round(x.v*100)/100,vm:Math.round(x.vm*100)/100,as:asAssinNorm(x.ao),st:''}});

function asExemploRows(){return AS_EXEMPLO.map(([f,sr,p,em,sf,cl,c,pg,v,vm,et,mg,ao])=>({f:String(f),s:sr,p:String(p),ems:dataBR(em),sf,cl,c,pg:dataBR(pg),v,vm,et:asEtapa(et),mg:mg===''?null:Math.round(mg*10000)/100,ao,st:'',as:asAssinNorm(ao)}))}
async function asCarregar(forcar){
  if(as.carregando||(as.dados&&!forcar))return;as.carregando=true;as.erro=null;
  try{let res=null;
    if(db&&!MODO_MS){const m=await db.doc('dashboards/assinatura').get();
      if(m.exists){const meta=m.data();const partes=await Promise.all(Array.from({length:meta.partes||0},(_,k)=>db.doc(`dashboards/assinatura_p${k}`).get()));const rows=JSON.parse(partes.map(p=>p.exists?p.data().d:'').join(''));
        if(rows.length&&'ems' in rows[0]){rows.forEach(r=>{r.as=asAssinNorm(r.ao)});res={rows,nome:meta.nome,em:meta.em,por:meta.por}}else if(rows.length)as.erro='A importação anterior está num formato antigo. Importe a planilha de novo.'}}
    as.dados=res||{rows:asExemploRows(),exemplo:true};
  }catch(e){console.warn(e);as.erro=e.message||'Não foi possível ler a planilha.';as.dados={rows:[],exemplo:true}}

async function asEnviar(file,btn){
  if(!/\.(xlsx|xlsm|xls|csv)$/i.test(file.name)){toast('Use uma planilha .xlsx, .xls ou .csv.');return}
  const txt=btn.textContent;btn.disabled=true;btn.textContent='Lendo planilha…';
  try{const buf=await file.arrayBuffer();const p=asLer(buf);const por=trfEu().nome;const agora=Date.now();btn.textContent='Salvando…';
    if(db&&!MODO_MS){const js=JSON.stringify(p.rows);const n=Math.ceil(js.length/PARTE);const ant=await db.doc('dashboards/assinatura').get();const nAnt=ant.exists?(ant.data().partes||0):0;
      for(let k=0;k<n;k++)await db.doc(`dashboards/assinatura_p${k}`).set({d:js.slice(k*PARTE,(k+1)*PARTE)});
      await db.doc('dashboards/assinatura').set({partes:n,nome:file.name,em:agora,por,uid:meId||null,linhas:p.rows.length});
      for(let k=n;k<nAnt;k++){try{await db.doc(`dashboards/assinatura_p${k}`).delete()}catch(e){}}}
    as.dados={rows:p.rows,nome:file.name,em:agora,por};as.erro=null;

  }catch(e){console.warn(e);toast(e.message||'Não foi possível ler a planilha.');btn.disabled=false;btn.textContent=txt}
}

function ligarBanco(){
  db.doc('admin/config').onSnapshot(s=>{
    if(s.exists&&s.data().cfg){cfg=migrar(clone(s.data().cfg));cfgExiste=true}else{cfgExiste=false}
    if(view==='config'&&!draftDirty)draft=clone(cfg);
    renderTabs();
    if(view==='abrir'&&!formDirty)renderAbrir();
    else if(view==='config'&&!draftDirty)renderConfig();
    else if(view==='config')paintBar();
  },()=>{});
  if(!MODO_MS)db.collection('checklistEmp').orderBy('criadoEm','desc').limit(1000).onSnapshot(s=>{empL=s.docs.map(x=>x.data());empOk=true;if(view==='empil')paintEmp()},e=>{console.warn('checklistEmp',e)});
  if(!MODO_MS)db.collection('esteira').orderBy('criadoEm','desc').limit(3000).onSnapshot(s=>{sem=s.docs.map(x=>x.data());semOk=true;renderTabs();if(view==='sem')paintSem()},e=>{console.warn('esteira',e);toast('Não foi possível carregar a esteira de sementes.')});
  if(!MODO_MS)db.collection('transferencias').orderBy('criadoEm','desc').limit(1000).onSnapshot(s=>{transf=s.docs.map(x=>x.data());trfOk=true;renderTabs();if(view==='transf')paintTrf()},e=>{console.warn('transferencias',e);toast('Não foi possível carregar as transferências.')});
  db.collection('chamados').orderBy('criadoEm','desc').limit(1000).onSnapshot(s=>{
    tickets=s.docs.map(x=>x.data());
    renderTabs();
    if(view==='indicadores')renderIndicadores();
    if(view==='dash')renderDash();
    if(view==='painel'){
      const ativo=document.activeElement;const id=ativo&&ativo.id;
      if(id==='d-coment'||String(id||'').startsWith('d-resp')||id==='busca'||id==='busca-nota'){ /* não interromper quem está digitando */
        const t=tickets.find(t=>t.numero===ticketSel);const tl=document.getElementById('timeline');if(t&&tl)pintarHistorico(t,tl);
      }else renderPainel();
    }
  },e=>{setBanner('A conexão com a fila caiu. Recarregue a página para voltar a receber atualizações.')});
}
</script>

</body></html>
